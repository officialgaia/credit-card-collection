name: kensho-test

on:
  pull_request:
    paths: ["kensho-auto/**", ".github/workflows/kensho-*.yml"]
  push:
    branches: [main]
    paths: ["kensho-auto/**", ".github/workflows/kensho-*.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kensho-auto
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kensho-auto/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
