<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>新商品発売記念 プレゼント</title>
<style>.custom input[type=checkbox]{opacity:0;position:absolute;width:1px;height:1px} .custom span{padding-left:24px}</style>
</head>
<body>
<form id="search" action="/search"><input type="text" name="q" placeholder="サイト内検索"></form>
<form action="thanks.html" method="post">
<table>
  <tr><th>氏名 <em>必須</em></th><td><input type="text" name="f001" placeholder="例）山田 太郎"></td></tr>
  <tr><th>ふりがな <em>必須</em></th><td><input type="text" name="f002" placeholder="例）やまだ たろう"></td></tr>
  <tr><th>郵便番号 <em>必須</em></th><td><input type="text" name="f003" placeholder="123-4567"></td></tr>
  <tr><th>都道府県 <em>必須</em></th><td><select name="f004"><option value="">--選択--</option><option value="北海道">北海道</option><option value="東京都">東京都</option></select></td></tr>
  <tr><th>ご住所 <em>必須</em></th><td><input type="text" name="f005"></td></tr>
  <tr><th>電話番号（ハイフンなし） <em>必須</em></th><td><input type="tel" name="f006"></td></tr>
  <tr><th>メールアドレス <em>必須</em></th><td><input type="email" name="f007"></td></tr>
  <tr><th>生年月日 <em>必須</em></th><td><input type="date" name="f008"></td></tr>
  <tr><th>年代</th><td><select name="f009"><option value="">選択してください</option><option>10代</option><option>20代</option><option>30代</option><option>40代</option></select></td></tr>
  <tr><th>普段よく飲む飲料 <em>必須</em></th><td><select name="f010"><option value="">選択してください</option><option>お茶</option><option>コーヒー</option><option>その他</option></select></td></tr>
  <tr><th>商品の満足度</th><td>
    <label><input type="radio" name="f011" value="5">とても満足</label>
    <label><input type="radio" name="f011" value="3">どちらでもない</label>
    <label><input type="radio" name="f011" value="1">不満</label></td></tr>
  <tr><th>ご意見・ご感想（任意）</th><td><textarea name="f012"></textarea></td></tr>
</table>
<label class="custom"><input type="checkbox" name="f013" value="yes"><span>キャンペーン規約に同意します</span></label>
<input type="submit" value="応募する">
</form>
</body></html>
